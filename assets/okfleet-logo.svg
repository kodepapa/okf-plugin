  <rect x="6" y="6" width="948" height="248" rx="42" fill="url(#panel)" stroke="#1E4E8C" stroke-width="2"/>
  <circle cx="868" cy="44" r="74" fill="#0EA5E9" opacity="0.06"/>
  <circle cx="906" cy="208" r="118" fill="#2563EB" opacity="0.07"/>


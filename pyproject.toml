[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "okfleet"
version = "0.5.0"
description = "The local-first developer workbench for Open Knowledge Format bundles"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "kodepapa" }]
keywords = [
  "agent-skills",
  "claude",
  "codex",
  "knowledge-management",
  "mcp",
  "okf",
  "open-knowledge-format",
  "tui",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Documentation",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.6",
  "platformdirs>=4.3",
  "rich>=13.9",
  "ruamel.yaml>=0.18.6",
  "textual>=0.89",
  "typer>=0.15",
  "watchfiles>=1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pre-commit>=4.6",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
okfleet = "okfleet.cli:main"

[project.urls]
Homepage = "https://github.com/kodepapa/okfleet"
Repository = "https://github.com/kodepapa/okfleet"
Changelog = "https://github.com/kodepapa/okfleet/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kodepapa/okfleet#readme"
Issues = "https://github.com/kodepapa/okfleet/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/okfleet"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "okfleet/provider_plugin/skills"
".claude-plugin" = "okfleet/provider_plugin/.claude-plugin"

# Hatch normally follows the checked-in `.claude/skills` symlinks and then omits
# their canonical targets from the sdist. The wheel is built from the sdist, so
# force the canonical skills back in to keep `uv build` reproducible.
[tool.hatch.build.targets.sdist.force-include]
"skills" = "skills"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires authenticated provider access"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["skills/*/scripts/okf.py", "okf-skill-workspace/grade.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["okfleet"]
warn_unused_ignores = false

[tool.coverage.run]
branch = true
source = ["okfleet"]

[tool.coverage.report]
fail_under = 58
show_missing = true
skip_covered = true

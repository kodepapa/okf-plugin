name: Feature request
description: Propose a focused improvement to OKFleet
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: What OKF knowledge-management task is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than a required implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety model
      options:
        - label: This preserves read-only fleet chat and staged-by-default writes.
          required: true

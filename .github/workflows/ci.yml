name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & distribution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Verify generated helpers
        run: uv run python tools/verify_generated.py
      - name: Test with coverage
        run: uv run pytest --cov=okfleet --cov-report=term-missing:skip-covered
      - name: Build wheel and source distribution
        run: uv build --clear
      - name: Verify packaged files and metadata
        run: uv run python tools/verify_distribution.py dist
      - name: Check package metadata
        run: uvx --from twine==6.2.0 twine check dist/*
      - name: Install and smoke-test the wheel
        run: |
          uv venv /tmp/okfleet-package-smoke
          uv pip install --python /tmp/okfleet-package-smoke/bin/python dist/*.whl
          /tmp/okfleet-package-smoke/bin/okfleet --version
          /tmp/okfleet-package-smoke/bin/python -c "from importlib.resources import files; root = files('okfleet') / 'provider_plugin'; assert (root / 'skills' / 'okf-read' / 'SKILL.md').is_file(); assert (root / '.claude-plugin' / 'plugin.json').is_file()"

  compatibility:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --extra dev
      - name: Run compatibility tests
        run: uv run pytest

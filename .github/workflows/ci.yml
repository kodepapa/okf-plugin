name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test with coverage
        run: uv run pytest --cov=okfleet --cov-report=term-missing:skip-covered
      - name: Verify generated helpers
        run: uv run python tools/verify_generated.py

  package:
    name: Distribution smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --extra dev
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify packaged files and metadata
        run: uv run python tools/verify_distribution.py dist
      - name: Check package metadata
        run: uvx twine check dist/*
      - name: Install and smoke-test the wheel
        run: |
          uv venv /tmp/okfleet-package-smoke
          uv pip install --python /tmp/okfleet-package-smoke/bin/python dist/*.whl
          /tmp/okfleet-package-smoke/bin/okfleet --version
          /tmp/okfleet-package-smoke/bin/python -c "from importlib.resources import files; root = files('okfleet') / 'provider_plugin'; assert (root / 'skills' / 'okf-read' / 'SKILL.md').is_file(); assert (root / '.claude-plugin' / 'plugin.json').is_file()"

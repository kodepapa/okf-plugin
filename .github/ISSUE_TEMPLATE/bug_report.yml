name: Bug report
description: Report a reproducible OKFleet defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OKFleet. Search existing issues first. Do not include credentials, private bundle content, or authenticated provider transcripts. Report security issues through [private vulnerability reporting](https://github.com/kodepapa/okfleet/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: OKFleet version
      placeholder: Output of `okfleet --version`
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Installation method
      placeholder: uvx, uv tool, pipx, pip, or source checkout
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - TUI
        - CLI
        - Python API
        - MCP
        - Web
        - LSP
        - Codex provider
        - Claude Code provider
        - Skills or plugin packaging
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a sanitized example bundle and include the exact command or keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS/Linux, terminal, Python version, provider CLI version if relevant
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste relevant output from `okfleet doctor --format json`. Remove private paths or content before submitting.
      render: json
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, or a minimal example bundle if they help reproduce the issue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private bundle content, sensitive paths, and authenticated provider transcripts.
          required: true

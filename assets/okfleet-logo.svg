    <text x="4" y="174" fill="#8CC8FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="650" letter-spacing="3.3">OPEN KNOWLEDGE. ONE TERMINAL. EVERY BUNDLE.</text>

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "okfleet"
version = "0.5.0"
description = "The terminal workbench for a fleet of Open Knowledge Format bundles"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "kodepapa" }]
keywords = ["okf", "knowledge", "tui", "codex", "claude", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
]
dependencies = [
  "mcp>=2.0.0",
  "platformdirs>=4.11.3",
  "rich>=13.9",
  "ruamel.yaml>=0.18.6",
  "textual>=0.89",
  "typer>=0.27.1",
  "watchfiles>=1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.16.3",
]

[project.scripts]
okfleet = "okfleet.cli:main"

[project.urls]
Homepage = "https://github.com/kodepapa/okf-plugin"
Repository = "https://github.com/kodepapa/okf-plugin"
Changelog = "https://github.com/kodepapa/okf-plugin/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kodepapa/okf-plugin#readme"
Issues = "https://github.com/kodepapa/okf-plugin/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/okfleet"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "okfleet/provider_plugin/skills"
".claude-plugin" = "okfleet/provider_plugin/.claude-plugin"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires authenticated provider access"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["skills/*/scripts/okf.py", "okf-skill-workspace/grade.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["okfleet"]
warn_unused_ignores = false

[tool.coverage.run]
branch = true
source = ["okfleet"]

[tool.coverage.report]
fail_under = 58
show_missing = true
skip_covered = true
